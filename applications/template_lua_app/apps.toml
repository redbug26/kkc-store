[application]
id = "my_lua_app"
name = "My Kapsule"
version = "0.1.0"
description = "Starter template for KKC Kapsules"
category = "development"

[runtime]
main = "src/app.lua"
fps = 30

[[install]]
os = ["macos", "linux", "windows"]
method = "manual"
url = "https://github.com/redbug26/kkc-store/tree/main/applications/template_lua_app"
command = "Copy the complete template_lua_app directory into the KKC data applications directory as my_lua_app, then launch it using the association command kkc-lua-app:my_lua_app %f. Requires KKC with Kapsule support."

[extra]
homepage = "https://github.com/redbug26/kkc-store/tree/main/applications/template_lua_app"
notes = "KKC Kapsule (Lua application). Metadata and runtime settings are stored in apps.toml; keep this descriptor and all Lua files together."
