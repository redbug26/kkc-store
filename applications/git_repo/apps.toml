[application]
id = "git_repo"
name = "Git Repo"
version = "0.1.0"
description = "Git status/stage/unstage/commit/push/pull for current panel repository"
category = "development"

[runtime]
main = "app.lua"
fps = 15
width = 96
height = 30

[[install]]
os = ["macos", "linux", "windows"]
method = "manual"
url = "https://github.com/redbug26/kkc-store/tree/main/applications/git_repo"
command = "Copy the complete git_repo directory into the KKC data applications directory as git_repo, then launch it using the association command kkc-lua-app:git_repo %f. Requires KKC with Kapsule support."

[extra]
homepage = "https://github.com/redbug26/kkc-store/tree/main/applications/git_repo"
notes = "KKC Kapsule (Lua application). Metadata and runtime settings are stored in apps.toml; keep this descriptor and all Lua files together."
