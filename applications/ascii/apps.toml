[application]
id = "ascii"
name = "ASCII Table"
version = "0.1.0"
description = "ASCII chart explorer for terminal"
category = "utility"

[runtime]
main = "app.lua"
fps = 15
width = 79
height = 24

[[install]]
os = ["macos", "linux", "windows"]
method = "manual"
url = "https://github.com/redbug26/kkc-store/tree/main/applications/ascii"
command = "Copy the complete ascii directory into the KKC data applications directory as ascii, then launch it using the association command kkc-lua-app:ascii %f. Requires KKC with Kapsule support."

[extra]
homepage = "https://github.com/redbug26/kkc-store/tree/main/applications/ascii"
notes = "KKC Kapsule (Lua application). Metadata and runtime settings are stored in apps.toml; keep this descriptor and all Lua files together."
