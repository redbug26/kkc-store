[application]
id = "ascii"
name = "ASCII Table"
version = "0.1.0"
description = "ASCII chart explorer for terminal"
category = "utility"

[runtime]
main = "app.lua"
fps = 15
width = 79
height = 24

[[install]]
os = ["macos", "linux", "windows"]
method = "manual"
url = "https://github.com/redbug26/kkc-store/tree/main/applications/ascii"
command = "Copy the complete ascii directory into the KKC data applications directory as ascii, recreate app.toml with an [app] table containing id, name, version and description from [application], plus the available main, fps, width and height fields from [runtime] in apps.toml, then launch it using the association command kkc-lua-app:ascii %f. Requires KKC with Lua application support."

[extra]
homepage = "https://github.com/redbug26/kkc-store/tree/main/applications/ascii"
notes = "KKC Lua application. Runtime settings are stored in apps.toml. The current KKC Lua runtime requires an app.toml manifest generated from them; keep all Lua files together."
