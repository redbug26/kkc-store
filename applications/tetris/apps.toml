[application]
id = "tetris"
name = "Tetris"
version = "0.1.0"
description = "Terminal Tetris powered by the KKC Kapsule runtime"
category = "other"

[runtime]
main = "app.lua"
fps = 20
width = 46
height = 26

[[install]]
os = ["macos", "linux", "windows"]
method = "manual"
url = "https://github.com/redbug26/kkc-store/tree/main/applications/tetris"
command = "Copy the complete tetris directory into the KKC data applications directory as tetris, then launch it using the association command kkc-lua-app:tetris %f. Requires KKC with Kapsule support."

[extra]
homepage = "https://github.com/redbug26/kkc-store/tree/main/applications/tetris"
notes = "KKC Kapsule (Lua application). Metadata and runtime settings are stored in apps.toml; keep this descriptor and all Lua files together."
