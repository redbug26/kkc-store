[application]
id = "tetris"
name = "Tetris"
version = "0.1.0"
description = "Terminal Tetris powered by KKC Lua app runtime"
category = "other"

[runtime]
main = "app.lua"
fps = 20
width = 46
height = 26

[[install]]
os = ["macos", "linux", "windows"]
method = "manual"
url = "https://github.com/redbug26/kkc-store/tree/main/applications/tetris"
command = "Copy the complete tetris directory into the KKC data applications directory as tetris, recreate app.toml with an [app] table containing id, name, version and description from [application], plus the available main, fps, width and height fields from [runtime] in apps.toml, then launch it using the association command kkc-lua-app:tetris %f. Requires KKC with Lua application support."

[extra]
homepage = "https://github.com/redbug26/kkc-store/tree/main/applications/tetris"
notes = "KKC Lua application. Runtime settings are stored in apps.toml. The current KKC Lua runtime requires an app.toml manifest generated from them; keep all Lua files together."
