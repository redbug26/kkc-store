[application]
id = "rockland"
name = "Rockland"
version = "0.1.0"
description = "Boulder-dash style cave game for KKC"
category = "other"

[runtime]
main = "app.lua"
fps = 30
width = 96
height = 32

[[install]]
os = ["macos", "linux", "windows"]
method = "manual"
url = "https://github.com/redbug26/kkc-store/tree/main/applications/rockland"
command = "Copy the complete rockland directory into the KKC data applications directory as rockland, then launch it using the association command kkc-lua-app:rockland %f. Requires KKC with Kapsule support."

[extra]
homepage = "https://github.com/redbug26/kkc-store/tree/main/applications/rockland"
notes = "KKC Kapsule (Lua application). Metadata and runtime settings are stored in apps.toml; keep this descriptor and all Lua files together."
