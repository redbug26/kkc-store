[application]
id = "rockland"
name = "Rockland"
version = "0.1.0"
description = "Boulder-dash style cave game for KKC"
category = "other"

[runtime]
main = "app.lua"
fps = 30
width = 96
height = 32

[[install]]
os = ["macos", "linux", "windows"]
method = "manual"
url = "https://github.com/redbug26/kkc-store/tree/main/applications/rockland"
command = "Copy the complete rockland directory into the KKC data applications directory as rockland, recreate app.toml with an [app] table containing id, name, version and description from [application], plus the available main, fps, width and height fields from [runtime] in apps.toml, then launch it using the association command kkc-lua-app:rockland %f. Requires KKC with Lua application support."

[extra]
homepage = "https://github.com/redbug26/kkc-store/tree/main/applications/rockland"
notes = "KKC Lua application. Runtime settings are stored in apps.toml. The current KKC Lua runtime requires an app.toml manifest generated from them; keep all Lua files together."
