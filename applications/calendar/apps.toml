[application]
id = "calendar"
name = "Calendar"
version = "0.1.0"
description = "Terminal monthly calendar"
category = "utility"

[runtime]
main = "app.lua"
fps = 15
width = 28
height = 20

[[install]]
os = ["macos", "linux", "windows"]
method = "manual"
url = "https://github.com/redbug26/kkc-store/tree/main/applications/calendar"
command = "Copy the complete calendar directory into the KKC data applications directory as calendar, then launch it using the association command kkc-lua-app:calendar %f. Requires KKC with Kapsule support."

[extra]
homepage = "https://github.com/redbug26/kkc-store/tree/main/applications/calendar"
notes = "KKC Kapsule (Lua application). Metadata and runtime settings are stored in apps.toml; keep this descriptor and all Lua files together."
