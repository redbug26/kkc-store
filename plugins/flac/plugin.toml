[plugin]
id = "flac"
name = "FLAC Decoder"
version = "0.1.0"
type = "viewer"
description = "FLAC decoder plugin for kkc-rust audio-rust ABI"
mime_types = ["audio/flac"]
modes = ["text"]

[location]
kind = "github"
repo = "redbug26/kkc-plugins-rust"
ref = "main"
asset_url = "https://github.com/redbug26/kkc-plugins-rust/releases/download/{tag}/flac-{os}-{arch}.zip"

[extra]
author = "kkc"
license = "MIT"
runtime = "rust/abi_stable"
